<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% raw %}{% block title %}{% endraw %}{{ cookiecutter.project_name }}{% raw %}{% endblock %}{% endraw %}
    </title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{% raw %}{{ url_for('static', filename='css/style.css') }}{% endraw %}"
    />

    {% raw %}{% block extra_head %}{% endblock %}{% endraw %}
  </head>

  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a
          class="navbar-brand"
          href="{% raw %}{{ url_for('main.home') }}{% endraw %}"
          >{{ cookiecutter.project_name }}</a
        >

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a
                class="nav-link"
                href="{% raw %}{{ url_for('main.home') }}{% endraw %}"
                >Home</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link"
                href="{% raw %}{{ url_for('main.about') }}{% endraw %}"
                >About</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link"
                href="{% raw %}{{ url_for('main.contact') }}{% endraw %}"
                >Contact</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container my-4">
      {% raw %}{% block content %}{% endblock %}{% endraw %}
    </main>

    <footer class="bg-dark text-light py-3 mt-5">
      <div class="container text-center">
        <p class="mb-0">&copy; 2024 {{ cookiecutter.project_name }}</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% raw %}{{ url_for('static', filename='js/main.js') }}{% endraw %}"></script>

    {% raw %}{% block extra_scripts %}{% endblock %}{% endraw %}
  </body>
</html>
